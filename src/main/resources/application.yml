spring:
  application:
    name: task-manager
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: ${DATABASE_MIN_IDLE:2}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  cache:
    type: caffeine

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT2H}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:false}
    admin-name: ${BOOTSTRAP_ADMIN_NAME:Admin User}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@taskmanager.local}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin@123}
    member-name: ${BOOTSTRAP_MEMBER_NAME:Member User}
    member-email: ${BOOTSTRAP_MEMBER_EMAIL:member@taskmanager.local}
    member-password: ${BOOTSTRAP_MEMBER_PASSWORD:Member@123}
